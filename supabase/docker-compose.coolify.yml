# Reference compose only — production deploy uses Coolify built-in Supabase service.
# Deployed via MCP: service action=create type=supabase (see mgold-supabase service).
# Service UUID: i8dluteyhsud1a50pjggmndy | Project: mgold (izv45fg10ciy37msgkep5vwe)

services:
  studio:
    image: supabase/studio:20250317-6955350
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}

  kong:
    image: kong:2.8.1
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml

  auth:
    image: supabase/gotrue:v2.170.0
    restart: unless-stopped
    environment:
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_DB_DRIVER: postgres
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres

  rest:
    image: postgrest/postgrest:v12.2.8
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}

  db:
    image: supabase/postgres:15.8.1.060
    restart: unless-stopped
    volumes:
      - supabase-db:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d

volumes:
  supabase-db:
